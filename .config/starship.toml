# Starship Configuration - Modern Minimalist (2-Line)

format = """
$os$directory$git_branch$git_status$c$elixir$elm$golang$gradle$haskell$java$julia$nodejs$nim$rust$scala$docker_context$time
$character"""

# コマンドの実行時間を右側に表示しない（シンプルにするため）
command_timeout = 5000

[os]
disabled = false
style = "bold white"
format = "[$symbol]($style) "

[os.symbols]
# 【重要】Linux / Unknown にも Arch のアイコンを割り当てること。
# starship は /etc/os-release の ID を見て OS を判別するが、Esca は
# ID=esca を名乗るため starship の既知一覧に無く、汎用の Linux 扱いになる。
# その結果 Arch = の行は使われず、既定のペンギンが表示される。
# ID を arch に戻すとブランディングが消えるので、こちら側で対応する。
Arch = " "
# Esca 専用グリフ（U+100000 = アンコウの誘引突起）。
# Esca は /etc/os-release で ID=esca を名乗るため starship の既知一覧に無く、
# 汎用の Linux 扱いになる。そこを自前のグリフで置き換える。
# 表示には EscaSymbols.otf が必要（install.sh が /usr/share/fonts/esca に配置）。
# フォントが無い環境では豆腐(□)になるので、その場合は下2行を
# " " に戻せば Arch のアイコンで代用できる。
Linux = "􀀀 "
Unknown = "􀀀 "
Ubuntu = " "
Debian = " "
Fedora = " "
Macos = " "
Windows = " "

[directory]
style = "bold blue"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "[$all_status$ahead_behind]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold red"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold blue"
format = "via [$symbol$context]($style) "

[time]
disabled = false
time_format = "%R"
style = "bold yellow"
format = "at [$time]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"