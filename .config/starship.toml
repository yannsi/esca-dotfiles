# Starship Configuration - Modern Minimalist (2-Line)

format = """
$os$directory$git_branch$git_status$c$elixir$elm$golang$gradle$haskell$java$julia$nodejs$nim$rust$scala$docker_context$time
$character"""

# コマンドの実行時間を右側に表示しない（シンプルにするため）
command_timeout = 5000

[os]
disabled = false
style = "bold white"
format = "[$symbol]($style) "

[os.symbols]
# 【重要】Arch だけでなく Linux / Unknown にも同じアイコンを割り当てること。
# starship は /etc/os-release の ID を見て OS を判別する。Esca は ID=esca を
# 名乗るため starship の既知一覧に無く、汎用の Linux 扱いになる。
# その結果 Arch = の行は使われず、既定のペンギンが出てしまう。
# ID を arch に戻すとブランディングが消えるので、こちら側で対応する。
#
# 【経緯】以前は Linux / Unknown に Esca 専用グリフ (U+100000) を置いていたが、
# GNOME など一部の環境でどうしても豆腐(□)になった。私用領域(PUA)の符号位置は
# 「意味が未定義」であることを理由にフォントフォールバックを行わない
# レンダラ実装があり、環境差を制御しきれない。ブランディングのために
# プロンプトが壊れるのは本末転倒なので、標準アイコンに統一した。
Arch = " "
Linux = " "
Unknown = " "
Ubuntu = " "
Debian = " "
Fedora = " "
Macos = " "
Windows = " "

[directory]
style = "bold blue"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
# 【重要】U+F83D は Nerd Fonts v3 で削除された (U+F500-FD46 が廃止)。
# v2 時代の設定を持ち込むと、フォントは入っているのにここだけ豆腐になる。
read_only = " "

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "[$all_status$ahead_behind]($style) "

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold red"
format = "via [$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold cyan"
format = "via [$symbol($version )]($style)"

[python]
symbol = " "
style = "bold yellow"
format = "via [$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "bold blue"
format = "via [$symbol$context]($style) "

[time]
disabled = false
time_format = "%R"
style = "bold yellow"
format = "at [$time]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"