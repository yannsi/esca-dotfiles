# Esca Linux - hypridle 設定（自動ロック）
#
# niri 側（swayidle）と同じく、30分操作がなければロック、60分でサスペンド、
# スリープ前にもロックする。
# hypridle は Hyprland 本体と違って Lua 設定に移行していないので、この書式のまま使う。
# 参考: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # 二重に hyprlock が起動しないよう、動いていれば何もしない
    lock_cmd = pidof hyprlock || hyprlock
    # スリープ前にロックする（復帰時にロック画面が出る）
    before_sleep_cmd = loginctl lock-session
}

# 30分でロック
listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

# 60分でサスペンド
listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
