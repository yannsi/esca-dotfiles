# Esca Linux - hyprpaper 設定
#
# 【重要】hyprpaper はパッケージを入れるだけでは何も表示しない。
# このファイルと、hyprland.lua 側の自動起動の両方が必要。
#
# 【重要】preload と wallpaper は両方書くこと。
# preload していない画像を wallpaper に指定しても「読み込まれていない」と
# 拒否され、画面は真っ黒のままになる。
#
# wallpaper の書式は "<出力名>,<パス>"。出力名を空にすると全モニターに適用される。
# 特定のモニターだけ変えたい場合は "DP-1,/path/to/other.png" のように書く。

preload = /usr/share/backgrounds/esca/esca.png
wallpaper = ,/usr/share/backgrounds/esca/esca.png

# IPC を切ると hyprctl hyprpaper wallpaper での切り替えができなくなる。
# scripts/wallchange.sh がこれを使うため有効のままにしておくこと。
ipc = on

# 起動時のロゴ表示は不要
splash = false
